stages:
  - test
  - sonar
  - build
  - api-docs
  - mend

test:
  stage: test
  image: eclipse-temurin:21.0.11_10-jdk-alpine
  tags:
    - docker
  script:
    - chmod +x ./gradlew
    - ./gradlew -Dorg.gradle.daemon=false test

sonar:
  stage: sonar
  image: eclipse-temurin:21.0.11_10-jdk-alpine
  only:
    - develop
    - /^release/
  script:
    - chmod +x ./gradlew
    - ./gradlew integrationTest jacocoTestCoverageVerification
    - ./gradlew -Dsonar.host.url=${SONAR_HOST} -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.projectName=${SONAR_PROJECT_NAME} -Dsonar.branch.name=${CI_COMMIT_BRANCH} -Dsonar.login=${SONAR_LOGIN_TOKEN} sonarqube

build_and_push_latest_image:
  stage: build
  image: docker:29.4.3
  only:
    - develop
  variables:
    IMAGE_TAG: "latest"
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
  script:
    - docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
    - docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG

build_and_push_alfa_image:
  stage: build
  image: docker:29.4.3
  only:
    - /^release/
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
  script:
    - export IMAGE_TAG=$(echo $CI_COMMIT_BRANCH | cut -c 9-)-alfa
    - docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
    - docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG

build_and_push_release_image:
  stage: build
  only:
    - tags
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
  script:
    - export IMAGE_TAG=$(echo $CI_COMMIT_TAG | cut -c 2-)
    - docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
    - docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG

generate_api_docs:
  stage: api-docs
  image: eclipse-temurin:21.0.11_10-jdk-alpine
  # only:
  #   - develop
  #   - /^release/
  #   - tags
  script:
    - chmod +x ./gradlew
    - ./gradlew -Dorg.gradle.daemon=false generateOpenApiJson
  artifacts:
    name: "openapi-$CI_COMMIT_REF_SLUG"
    paths:
      - build/openapi/openapi.json
    expire_in: 30 days

sync_api_docs:
  stage: api-docs
  image: instrumentisto/rsync-ssh:alpine
  # only:
  #   - develop
  #   - /^release/
  #   - tags
  needs:
    - generate_api_docs
  before_script:
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - rsync -ah --progress build/openapi/openapi.json $SSH_HOST:$SSH_FILE_PATH
  dependencies:
    - generate_api_docs

mend:
  stage: mend
  image: eclipse-temurin:21.0.11_10-jdk-jammy
  only:
    - /^release/
  variables:
    PRODUCT_NAME: "nmaas"
    PROJECT_NAME: "nmaas-platform"
  script:
    - |
      export PRODUCT_VERSION=$(echo $CI_COMMIT_BRANCH | cut -c 9-)
      export PROJECT_VERSION=$PRODUCT_VERSION
      apt-get update && apt-get install -y curl
      chmod +x ./gradlew
      curl -LJO https://github.com/whitesource/unified-agent-distribution/releases/latest/download/wss-unified-agent.jar
      java -jar wss-unified-agent.jar -userKey ${MEND_USER_KEY} -apiKey ${MEND_API_KEY} -projectVersion ${PROJECT_VERSION} -project ${PROJECT_NAME} -productVersion ${PRODUCT_VERSION} -product ${PRODUCT_NAME} -c ./ws/ws.config -d ./
